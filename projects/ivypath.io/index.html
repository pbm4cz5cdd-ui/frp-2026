<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ivypath.io — поступление за рубеж</title>
<meta name="description" content="Требования университетов, экзамены и пошаговый план поступления за рубеж.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --tint:#f4f4f4; --text:#111111; --muted:#666666; --line:#e2e2e2;
  --brand:#2f4bd8; --go:#2f4bd8; --warn:#2f4bd8; --stop:#666666; --inv-bg:#111111; --inv-fg:#ffffff;
  --pad:clamp(20px,5vw,64px);
  --sans:"Geist","Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --serif:var(--sans);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0b0b; --surface:#0b0b0b; --tint:#171717; --text:#f2f2f2; --muted:#a0a0a0; --line:#2c2c2c;
  --brand:#9fb0ff; --go:#9fb0ff; --warn:#9fb0ff; --stop:#a0a0a0; --inv-bg:#f2f2f2; --inv-fg:#111111;
}}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --surface:#0b0b0b; --tint:#171717; --text:#f2f2f2; --muted:#a0a0a0; --line:#2c2c2c;
  --brand:#9fb0ff; --go:#9fb0ff; --warn:#9fb0ff; --stop:#a0a0a0; --inv-bg:#f2f2f2; --inv-fg:#111111;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(100px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font:400 16.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
h1,h2,h3,h4{margin:0}
.muted{color:var(--muted)} .small{font-size:15px}

.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;flex-wrap:wrap;gap:8px 28px;padding:14px max(var(--pad),calc((100% - 1200px)/2));background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font:800 19px/1 var(--sans);letter-spacing:-.02em;margin-right:auto}
.site-nav{display:flex;flex-wrap:wrap;gap:0 14px}
.site-nav button{font:600 15px/1 var(--sans);padding:10px 2px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer}
.site-nav button:hover{color:var(--text)}
.site-nav button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.site-nav button span:first-child{display:none}
.tools{display:flex;gap:8px;align-items:center}
.tools select,.tools button.icon{font:600 14px var(--sans);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer}

.hero{position:relative;display:flex;align-items:flex-end;min-height:clamp(340px,34vw,500px);background:#111 center/cover no-repeat;color:#fff;padding:0 var(--pad)}
.hero::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.56)}
.hero-inner{position:relative;width:100%;max-width:1200px;margin:0 auto;padding:clamp(56px,8vw,100px) 0 clamp(34px,5vw,56px)}
.hero h1{font:800 clamp(38px,6.4vw,80px)/1.02 var(--sans);letter-spacing:-.035em}
.hero p{margin:16px 0 0;max-width:46ch;font-size:clamp(17px,1.7vw,20px);color:rgba(255,255,255,.88)}
.pill{margin-top:16px;padding-left:12px;border-left:3px solid #fff;font-weight:600;font-size:15px}
.hero-credit{position:absolute;right:var(--pad);bottom:10px;font-size:12px;color:rgba(255,255,255,.7)}
.statsbar{border-bottom:1px solid var(--line);padding:0 var(--pad)}
.statsbar-inner{max-width:1200px;margin:0 auto;padding:22px 0;display:flex;flex-wrap:wrap;gap:14px 56px}
.stat{display:flex;align-items:baseline;gap:10px}
.stat b{font:800 30px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat small{font-size:15px;color:var(--muted)}

main{max-width:calc(1200px + 2*var(--pad));margin:0 auto;padding:0 var(--pad)}
.section{display:none;padding:12px 0 32px}
.section.active{display:block}
.section h2{font:800 clamp(28px,3.6vw,40px)/1.12 var(--sans);letter-spacing:-.03em;margin:0 0 8px}
.section>p.muted{margin:10px 0 22px;max-width:66ch}
.trust-box{margin:0 0 22px;padding:14px 18px;background:var(--tint);border-radius:8px;font-size:15px;max-width:76ch}
.trust-box b{font-weight:700}

.match-box{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;margin:0 0 28px;padding:22px 24px;background:var(--inv-bg);color:var(--inv-fg);border-radius:6px}
.match-text{margin-right:auto;display:flex;flex-direction:column;gap:2px}
.match-text b{font:700 20px/1.25 var(--sans)}
.match-text .muted{font-size:15px;color:inherit;opacity:.72}
#myScore,#myToefl,#mySat{-moz-appearance:textfield;appearance:textfield;width:100px;font:600 22px var(--sans);text-align:center;padding:10px 8px;border:0;border-radius:6px;background:var(--inv-fg);color:var(--inv-bg)}
#myScore::-webkit-inner-spin-button,#myToefl::-webkit-inner-spin-button,#mySat::-webkit-inner-spin-button{display:none}
.match-hint{flex-basis:100%;font-size:13.5px;opacity:.72}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.filters select,.filters input{flex:1 1 190px;min-width:0;font:500 15px var(--sans);padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.fav-toggle{font:600 14px var(--sans);padding:11px 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;white-space:nowrap}
.fav-toggle[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}

.grid{display:grid;gap:28px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{position:relative}
.card h3{font:700 18px/1.3 var(--sans)}
.card p{margin:8px 0 12px;color:var(--muted);font-size:15.5px}
.place{color:var(--muted);font-size:14.5px;margin:2px 0 4px}
.tags{display:flex;flex-direction:column;gap:2px;margin:0}
.tag{font-size:14.5px}
.tag.grey{color:var(--muted)}
a.link{font-weight:600;font-size:15px;color:var(--brand);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.star-btn{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:2px}
.star-btn[aria-pressed="true"]{color:var(--brand)}
.match-badge{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--sans);margin-top:6px}
.match-badge::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box}
.m-yes::before{background:currentColor}
.m-close::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.m-no,.m-unknown{color:var(--muted)}
.money{display:grid;gap:8px;margin:0}
.money div{display:flex;flex-direction:column}
.money span,.money small{font-size:13px;color:var(--muted)}
.money b{font:600 15.5px/1.3 var(--sans)}
.money.none{font-size:14px;color:var(--muted)}
.aid-bf{color:var(--text)} .aid-aware{color:var(--muted)}
.code{display:none}

#uniGrid,#examGrid,#courseGrid{display:block;border-top:1px solid var(--line)}
#uniGrid .card{display:grid;padding:24px 0;border-bottom:1px solid var(--line);column-gap:32px;row-gap:2px;grid-template-columns:minmax(200px,1.2fr) minmax(0,1.2fr) minmax(0,1.5fr) 170px;grid-template-areas:"name tags money act" "place tags money act" "badge tags money act"}
#uniGrid h3{grid-area:name}
#uniGrid .place{grid-area:place}
#uniGrid .match-badge{grid-area:badge;align-self:start}
#uniGrid .tags{grid-area:tags}
#uniGrid .money{grid-area:money}
#uniGrid .star-btn{grid-area:act;justify-self:end;align-self:start}
#uniGrid a.link{grid-area:act;justify-self:end;align-self:end}
#empty{display:none;text-align:center;padding:36px;color:var(--muted)}

#examGrid .card{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:6px 28px;padding:20px 0;border-bottom:1px solid var(--line)}
#examGrid .card p{margin:0}
#courseGrid .card{padding:22px 0;border-bottom:1px solid var(--line);max-width:72ch}
#resGrid .card{border-top:1px solid var(--line);padding-top:16px}
#costGrid .card{background:var(--tint);border-radius:10px;padding:26px}
.badge-official{display:inline-block;font:600 13px var(--sans);padding:2px 9px;background:var(--tint);color:var(--brand);border-radius:4px;margin-bottom:10px}
.city{color:var(--muted);font-size:15px;margin:2px 0 10px}
.price{font:800 38px/1.1 var(--sans);letter-spacing:-.02em;color:var(--text);margin:8px 0 10px}

.steps{list-style:none;counter-reset:s;padding:0;margin:24px 0 0;border-top:1px solid var(--line)}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:2px 16px;padding:20px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);grid-row:1/3;font:800 28px/1 var(--sans);color:var(--text)}
.steps b{font:700 18px/1.3 var(--sans)}
.steps span{color:var(--muted);font-size:16px}
.bullets{list-style:none;margin:0;padding:0}
.bullets li{position:relative;padding:0 0 12px 22px}
.bullets li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--brand)}

.calc{margin:26px 0;padding:22px 24px;background:var(--tint);border-radius:10px}
.calc>b{font:700 19px var(--sans)}
.calc-row{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}
.calc label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px;flex:1 1 150px}
.calc input{font:600 17px var(--sans);padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:100%}
.calc-out{font:700 18px var(--sans)}
.faq-h{font:800 26px var(--sans);letter-spacing:-.02em;margin:36px 0 12px}
#faqList details,.article{border-bottom:1px solid var(--line)}
#faqList{border-top:1px solid var(--line)}
#faqList summary,.article>summary{cursor:pointer;list-style:none;position:relative;padding:18px 40px 18px 0;font-weight:600}
#faqList summary::-webkit-details-marker,.article>summary::-webkit-details-marker{display:none}
#faqList summary::after,.article>summary::after{content:"+";position:absolute;right:4px;top:14px;font:400 26px var(--serif);color:var(--text)}
#faqList details[open]>summary::after,.article[open]>summary::after{content:"\2212"}
#faqList p{margin:0;padding:0 0 18px;color:var(--muted);max-width:68ch}
.article>summary{padding:22px 40px 22px 0}
.article>summary b{display:block;font:700 clamp(19px,2.2vw,24px)/1.25 var(--sans);letter-spacing:-.015em}
.article>summary span{display:block;margin-top:4px;font-weight:400;font-size:15.5px;color:var(--muted)}
.articles-wrap,#articleList{border-top:1px solid var(--line)}
.article-body{padding:0 0 28px;max-width:70ch}
.article-body h4{font:700 17px var(--sans);margin:26px 0 6px}
.article-body p{margin:0 0 10px;line-height:1.65}
.article-body ul{margin:0 0 10px;padding-left:20px}
.article-body li{margin-bottom:6px}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
.tbl th,.tbl td{padding:10px 14px 10px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl th{font-weight:700;color:var(--muted);font-size:14px}
.lang-note{font-size:14px;color:var(--muted);margin:10px 0}

.site-footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:64px;padding:28px max(var(--pad),calc((100% - 1200px)/2));border-top:1px solid var(--line);color:var(--muted);font-size:14.5px}
.site-footer a{color:var(--brand);font-weight:600}

@media (max-width:1360px){
  .site-nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .site-nav button{white-space:nowrap}
}
@media (max-width:960px){
  #uniGrid .card{grid-template-columns:1fr;grid-template-areas:"name" "place" "badge" "tags" "money" "act";row-gap:6px;padding-right:36px}
  #uniGrid .star-btn{grid-area:auto;position:absolute;top:22px;right:0}
  #uniGrid a.link{justify-self:start}
  #examGrid .card{grid-template-columns:1fr}
}
@media (max-width:700px){.brand{font-size:18px}}

body[data-page]:not([data-page="home"]) .hero,body[data-page]:not([data-page="home"]) .statsbar{display:none}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{font:700 16px var(--sans);padding:13px 24px;border-radius:999px;border:2px solid #fff;background:#fff;color:#111;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:#fff}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--bg)}
.section .hh{margin:48px 0 8px}
.cards4{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:24px 0 8px}
.feat{display:block;text-decoration:none;border:1px solid var(--line);border-radius:18px;padding:24px;background:var(--tint);transition:transform .15s}
.feat:hover{transform:translateY(-3px);border-color:var(--brand)}
.feat h3{font:700 19px/1.3 var(--sans);margin-bottom:8px}.feat p{margin:0;color:var(--muted);font-size:15.5px}
.split{display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center;margin:56px 0}
.split h2{margin-bottom:12px}
.panel{border:1px solid var(--line);border-radius:20px;padding:26px;background:var(--tint)}
.panel input{font:700 24px var(--sans);width:110px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);text-align:center}
#hOut{margin-top:14px;font-weight:600;color:var(--brand)}
.ugrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.ucard{border:1px solid var(--line);border-radius:18px;padding:22px}
.ucard h3{font:700 19px var(--sans)}.ucard .money{margin:12px 0}
.gcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;border:1px solid var(--line);border-radius:18px;padding:22px}
.gcard b{font:700 18px/1.3 var(--sans)}.gcard span{color:var(--muted);font-size:15px}
.cta-band{background:var(--brand);color:var(--bg);border-radius:24px;padding:44px 28px;text-align:center;margin:56px 0 0}
.cta-band h2{font:800 clamp(26px,4vw,38px) var(--sans);margin:0 0 8px}.cta-band p{opacity:.85;margin:0 0 20px}
.cta-band .btn{background:var(--bg);color:var(--brand);border-color:var(--bg)}
.foot-cols{display:grid;gap:28px;grid-template-columns:2fr 1fr 1fr;width:100%}
.foot-cols h4{margin:0 0 10px;color:var(--text)}.foot-cols a{display:block;margin:6px 0;font-weight:500;text-decoration:none}
.foot-bot{width:100%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);padding-top:18px}
@media(max-width:700px){.foot-cols{grid-template-columns:1fr}}
.hero{background:none!important;color:var(--text);min-height:0;display:block;padding:0 var(--pad)}
.hero::before{display:none}
.hero-inner{display:grid;gap:40px;grid-template-columns:1.1fr 1fr;align-items:center;padding:clamp(40px,6vw,72px) 0}
.hero h1{font-size:clamp(40px,5.6vw,68px)}
.hero p{color:var(--muted)}
.hero-credit{position:static;color:var(--muted);display:block;margin-top:6px}
#heroImg{aspect-ratio:16/10;border-radius:24px;background:#111 center/cover no-repeat}
.hero-list{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:10px}
.hero-list li::before{content:"✓";color:var(--brand);font-weight:800;margin-right:10px}
.btn{border-color:var(--text);background:var(--text);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
@media(max-width:860px){.hero-inner{grid-template-columns:1fr}}
.hero-inner{grid-template-columns:1fr;max-width:820px;margin:0}
.insta{text-align:center;margin:28px 0 0;color:var(--muted);font-weight:500}.insta a{margin-left:10px;color:var(--text);font-weight:700;text-decoration:none}
#uniGrid{display:grid;border-top:0;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
#uniGrid .card{display:flex;flex-direction:column;gap:8px;grid-template-columns:none;grid-template-areas:none;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--bg);cursor:pointer;position:relative;transition:transform .15s,border-color .15s}
#uniGrid .card:hover{transform:translateY(-3px);border-color:var(--brand)}
#uniGrid h3{font:700 19px/1.3 var(--sans);padding-right:34px;margin:0}
#uniGrid .star-btn{grid-area:auto;position:absolute;top:16px;right:16px}
#uniGrid .money,#uniGrid a.link,#uniGrid .code{display:none}
#uniGrid .tags{flex-direction:row;flex-wrap:wrap;gap:6px 14px;margin:4px 0}
#uniGrid .tag:nth-child(n+4){display:none}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:6px 0 2px}
.facts div{display:flex;flex-direction:column;gap:2px;font-size:14px}
.facts span{color:var(--muted);font-size:12px}
.facts b{font-weight:700}
.more{margin-top:auto;padding-top:10px;font-weight:600;color:var(--brand);font-size:15px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px 16px;z-index:200}
.modal[hidden]{display:none}
.sheet{background:var(--bg);color:var(--text);border-radius:20px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:28px;position:relative}
.sheet h3{font:700 24px/1.25 var(--sans);margin:0 34px 4px 0}.sheet h4{margin:20px 0 8px;font:700 15px var(--sans);color:var(--muted)}
.sheet .x{position:absolute;top:14px;right:16px;border:0;background:none;color:var(--text);font-size:28px;cursor:pointer}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin:0 6px 6px 0;font-size:14px}
#qsGrid .qcard{display:flex;flex-direction:column;gap:6px;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--bg);cursor:default;transition:border-color .15s}
#qsGrid .qcard[data-uni]{cursor:pointer}
#qsGrid .qcard:hover{border-color:var(--brand)}
#qsGrid .rank{font:800 20px/1 var(--sans);color:var(--brand)}
#qsGrid h3{font:700 17px/1.3 var(--sans)}
#qsGrid .meta{font-size:14px;color:var(--muted)}
#qsGrid .score{margin-top:auto;padding-top:8px;font-size:14px;font-weight:600}
#qsGrid .more{padding-top:0;font-size:14px}
.chat-panel{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:160;width:min(390px,calc(100vw - 36px));height:min(560px,calc(100vh - 36px));display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 60px rgba(0,0,0,.28);overflow:hidden}
.chat-panel[hidden]{display:none}
.chat-head{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.chat-head b{font:700 16px/1.3 var(--sans);display:block}
.chat-head span{font-size:13px;color:var(--muted)}
.chat-x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.chat-msg.bot{background:var(--tint);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.chat-msg.me{background:var(--text);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px}
.chat-msg.err{background:#fdecec;color:#8a1c1c;border:1px solid #f3c4c4;align-self:stretch;max-width:100%}
.chat-msg.bot a{color:inherit;font-weight:600}
.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:11px 13px;font:400 15px var(--sans)}

<script>
const COUNTRIES={usa:["США","АҚШ","USA"],uk:["Великобритания","Ұлыбритания","United Kingdom"],canada:["Канада","Канада","Canada"],germany:["Германия","Германия","Germany"],switzerland:["Швейцария","Швейцария","Switzerland"],netherlands:["Нидерланды","Нидерланды","Netherlands"],france:["Франция","Франция","France"],italy:["Италия","Италия","Italy"],sweden:["Швеция","Швеция","Sweden"],ireland:["Ирландия","Ирландия","Ireland"],singapore:["Сингапур","Сингапур","Singapore"],hongkong:["Гонконг","Гонконг","Hong Kong"],japan:["Япония","Жапония","Japan"],korea:["Южная Корея","Оңтүстік Корея","South Korea"],china:["Китай","Қытай","China"],australia:["Австралия","Австралия","Australia"],nz:["Новая Зеландия","Жаңа Зеландия","New Zealand"],uae:["ОАЭ","БАӘ","UAE"],turkey:["Турция","Түркия","Turkey"],hungary:["Венгрия","Венгрия","Hungary"],czech:["Чехия","Чехия","Czechia"],poland:["Польша","Польша","Poland"],finland:["Финляндия","Финляндия","Finland"],austria:["Австрия","Австрия","Austria"],malaysia:["Малайзия","Малайзия","Malaysia"],taiwan:["Тайвань","Тайвань","Taiwan"],belgium:["Бельгия","Бельгия","Belgium"],denmark:["Дания","Дания","Denmark"],norway:["Норвегия","Норвегия","Norway"],spain:["Испания","Испания","Spain"],saudi:["Саудовская Аравия","Сауд Арабиясы","Saudi Arabia"],qatar:["Катар","Катар","Qatar"],chile:["Чили","Чили","Chile"],brazil:["Бразилия","Бразилия","Brazil"],mexico:["Мексика","Мексика","Mexico"],argentina:["Аргентина","Аргентина","Argentina"],southafrica:["ЮАР","ОАР","South Africa"],russia:["Россия","Ресей","Russia"],india:["Индия","Үндістан","India"],indonesia:["Индонезия","Индонезия","Indonesia"],kazakhstan:["Казахстан","Қазақстан","Kazakhstan"]};

const GUIDES=[
 {t:"США из Казахстана: путь от 11 класса до кампуса",l:"Как устроен приём, тесты, дедлайны, эссе, виза и частые ошибки.",b:[
  {h:"Как устроен приём"},
  {p:"В США нет единых вступительных экзаменов и проходного балла. Каждый университет читает заявку целиком: оценки, тесты, эссе, рекомендации, занятия вне школы. Слабое место одной части можно уравновесить другой, но результат нельзя предсказать точно — поэтому подают сразу в несколько университетов."},
  {p:"Казахстанский аттестат принимается на бакалавриат напрямую: нужен транскрипт (оценки за 9–11 классы) с переводом на английский, заверенный школой. Некоторые университеты хотят видеть 12 лет школы и просят дополнительные экзамены (например, AP) — это указано в их требованиях для иностранцев."},
  {h:"Тесты"},
  {ul:["IELTS или TOEFL нужны почти всегда. У избирательных вузов типичный ориентир — IELTS 7.0 или TOEFL 100, у остальных ниже. Результат действует два года, поэтому сдавайте осенью 11 класса или раньше.","SAT/ACT: многие вузы test-optional, часть вернула требование. Правило: отправляйте балл, если он в диапазоне принятых студентов или выше; если ниже и вуз допускает test-optional — не отправляйте.","Призовые места на международных олимпиадах ценятся выше любого теста."]},
  {h:"Список университетов — три ряда"},
  {p:"Рабочий список — 8–12 вузов: амбициозные (ваш профиль ниже диапазона принятых или приём ниже 10%), реалистичные (профиль внутри диапазона) и надёжные (профиль выше). Список из одних амбициозных — главная причина «никуда не поступил». Вторым фильтром поставьте деньги: вуз, который семья не потянет и который не даёт помощи иностранцам, лучше не включать."},
  {h:"Common App и эссе"},
  {p:"Common App — единая платформа подачи в большинство частных и многие государственные вузы: одна анкета, одно главное эссе (до 650 слов) и дополнительные вопросы каждого университета. Рекомендации учителей и школьный отчёт отправляет школа — договоритесь с учителями в начале осени."},
  {p:"Главное эссе не про достижения (они уже в анкете), а про то, как вы думаете: один конкретный эпизод, ваша роль, что изменилось. Слабые эссе — общие слова про «мечту с детства». В эссе «почему именно мы» называйте конкретные программы, курсы, лаборатории. Чужой текст видно по несовпадению с остальной заявкой; помощь допустима как вопросы и разбор, но не как написание."},
  {h:"Дедлайны"},
  {table:[["Раунд","Срок","Что значит"],["Early Decision (ED)","около 1 ноября (ED II — январь)","Обязывает поступить, если приняли; подавать можно в один вуз. Рискованно, если нужна финансовая помощь: не успеете сравнить предложения."],["Early Action (EA)","около 1 ноября","Без обязательств, ответ в декабре; обычно можно подавать в несколько вузов."],["Regular Decision (RD)","1–15 января","Основной раунд, ответы к концу марта — началу апреля."],["Ответ вузу","1 мая","Выбираете один вуз и вносите депозит. Депозит сразу в два вуза — нарушение правил."]]},
  {h:"После приёма: виза"},
  {p:"После депозита вуз выдаёт форму I-20 — основание для студенческой визы F-1. Дальше: сбор SEVIS, анкета DS-160, собеседование в консульстве США (летом запись расписана заранее), подтверждение финансов на первый год, страховка и жильё. На собеседовании спросят о планах и оплате обучения; предложение помощи от университета — лучший аргумент."},
  {h:"Частые ошибки"},
  {ul:["Поздний старт: тесты, эссе и рекомендации нужны уже к осени 11 класса.","Список из одних амбициозных вузов.","Не подана финансовая форма (CSS Profile или форма вуза) — приняли, а помощи нет.","Эссе общими словами или написанное не вами.","Оценки по пятибалльной шкале «переведены» в GPA 4.0 без пояснений.","Запрос на полное финансирование в need-aware вуз при среднем профиле.","Виза в последний момент."]},
  {h:"План на два года"},
  {ul:["10 класс: английский всерьёз, выбор направления, 1–2 занятия вне школы.","Лето перед 11-м: первый список в три ряда, черновик главного эссе, договорённость о рекомендациях.","Сентябрь–октябрь 11-го: IELTS/TOEFL, SAT/ACT.","1 ноября: ED/EA и финансовые формы вместе с заявкой.","1 января: RD; проверьте, что школа отправила транскрипт и рекомендации.","Март–апрель: решения; сравнивайте чистую стоимость, а не ценники.","1 мая: выбор и депозит; май–июль: I-20, SEVIS, DS-160, собеседование."]}
 ]},
 {t:"Деньги: как учиться за рубежом дёшево или бесплатно",l:"Need-blind, need-aware, merit-стипендии, «Болашак» и что не подходит школьнику.",b:[
  {h:"Смотрите на «сколько заплатим мы», а не на ценник"},
  {p:"У вуза есть цена (обучение, проживание, страховка, учебники) и три способа её снизить: помощь по нужде (need-based aid), стипендия за достижения (merit) и государственная программа вашей страны. Дорогой частный университет с полной помощью по нужде иногда обходится дешевле вуза без помощи. Почти все истории про «бесплатную учёбу в США» — про помощь по нужде: вуз сам закрывает разницу между ценой и тем, что семья может платить."},
  {h:"Need-blind и need-aware"},
  {ul:["Need-blind: при решении о приёме комиссия не смотрит на финансы семьи, обычно в паре с обещанием покрыть всю подтверждённую нужду. Для иностранцев в США таких вузов очень мало (например, Гарвард, Йель, Принстон, MIT), и все они крайне избирательны.","Need-aware: помощь есть, но при равных кандидатах предпочтут того, кому нужно меньше. Сильный профиль с запросом на полное финансирование проходит, средний — часто нет.","Просите ровно столько, сколько реально нужно, и подтверждайте документами. Заранее посчитайте на калькуляторе чистой стоимости (net price calculator) на сайте вуза."]},
  {h:"Merit-стипендии"},
  {p:"Главный инструмент государственных вузов США, канадских и многих британских университетов. Суммы — от нескольких тысяч долларов до полной стоимости, но полные дают редко и по конкурсу: отдельная заявка, ранний дедлайн (часто 1 ноября или 1 декабря), иногда интервью. Помогают высокий SAT/ACT там, где его учитывают, ранняя подача (фонды расходуются по мере приёма) и международные олимпиады."},
  {h:"«Болашак» на бакалавриате"},
  {p:"По правилам, опубликованным на момент написания, бакалавриат по «Болашаку» открыт только победителям и призёрам международных олимпиад и научных конкурсов из утверждённого перечня. Правила и даты меняются каждый год — проверяйте на bolashak.gov.kz. Относитесь к «Болашаку» как к плану Б рядом с помощью вуза, а не вместо неё."},
  {h:"Что не подходит после 11 класса"},
  {ul:["Fulbright — магистратура и исследования, нужен диплом бакалавра.","Global UGRAD — семестровый обмен для действующих студентов.","Chevening — магистратура в Великобритании, нужен опыт работы.","DAAD — в основном магистратура и докторантура; бакалавриат в Германии обычно почти бесплатный, но на немецком.","Erasmus Mundus — совместные магистерские программы."]},
  {h:"Термины"},
  {ul:["CSS Profile и ISFAA — формы о доходах и активах семьи; без них помощь по нужде не назначат.","Full ride — покрывает всё, включая проживание; full tuition — только обучение."]}
 ]},
 {t:"Родителям: что делать семье",l:"Расходы на подачу, где теряются деньги и время, чем родитель реально полезен.",b:[
  {h:"Сколько стоит сама подача"},
  {p:"Помимо обучения есть расходы на подачу: тесты (IELTS/TOEFL, SAT/ACT), взносы за заявки (у многих вузов США обычно примерно $30–90 за вуз; семьям с низким доходом их часто отменяют по запросу), перевод и заверение документов, визовые сборы. На 10–12 вузов это легко сотни тысяч тенге ещё до первого ответа. Цены экзаменов — на вкладке «Стоимость»."},
  {h:"Где семьи теряют деньги и время"},
  {ul:["Агентство с «гарантией поступления»: гарантий нет, решает университет. Просите договор с перечнем услуг и ценой за каждую.","Восемь заявок только в вузы с приёмом ниже 10% — это лотерея, а не план.","Пропущенная финансовая форма — самая дорогая ошибка.","Депозит сразу в два университета — нарушение правил.","Эссе, написанное не ребёнком.","Виза в последний момент."]},
  {h:"Чем родитель полезен"},
  {ul:["Определить честный бюджет семьи — к осени 11 класса.","Собрать документы для финансовых форм.","Вовремя оплатить тесты и взносы.","Знать ближайший дедлайн и спрашивать про него, а не «ну как, поступаешь?»."]},
  {p:"Лучше не делать: писать эссе, звонить в приёмную комиссию вместо ребёнка, требовать только «топ-10»."},
  {h:"Стоит ли вообще ехать"},
  {p:"Зависит от трёх вещей: есть ли направление, которого нет или которое слабо в Казахстане; готов ли ребёнок жить один в 17–18 лет в другой языковой среде; сходится ли бюджет с учётом помощи, а не без неё. Если хоть на один вопрос ответ «нет» — рассмотрите сильные местные вузы, двойные дипломы или магистратуру за рубежом после бакалавриата дома, где стипендий гораздо больше. Плюсы известны (язык, связи, исследования), минусы называют реже: удалённость, стоимость перелётов, ограничения на работу по студенческой визе."},
  {h:"Когда начинать"},
  {p:"Идеально — в 10 классе, реально — летом перед 11-м. К декабрю 11 класса ранние раунды в США уже прошли."}
 ]}

function reqTagRank(t){
  if(/IELTS/i.test(t))return 0;
  if(/TOEFL/i.test(t))return 1;
  if(/SAT|ACT/i.test(t))return 2;
  if(/English test|French|Français|German|Deutsch|HSK|Danish|Korean|DET|Duolingo|PTE/i.test(t))return 3;
  if(/Entrance exam|Interview|Portfolio|Audition/i.test(t))return 4;
  if(/^AP\b/.test(t))return 5;
  if(/^(Need-blind|Need-aware|Merit scholarships|Government \+ university scholarships|Government scholarships only|No scholarships|Aid not published|Aid: see note)$/.test(t))return 6;
  return 9;
}

  const parts=[];

  if(!isNaN(mySat) && u.sat!=null) parts.push(mySat>=u.sat?0:(mySat>=u.sat-50?1:2));

function parseCsv(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    }else if(ch==='"')q=true;
    else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"){row.push(cell);cell="";if(row.some(x=>x.length))rows.push(row);row=[];}
    else if(ch!=="\r")cell+=ch;
  }
  row.push(cell);
  if(row.some(x=>x.length))rows.push(row);
  return rows;
}

function hasReqTag(u,re){return (u.tags||[]).some(t=>re.test(t));}
function addCsvReqTags(u){

    else if(/китай|hsk/.test(note)){if(!hasLang(/hsk/i))add("HSK required");}

    const ebrw=note.match(/ebrw\s*(\d+)/);
    const target=note.match(/(?:ориентир|цель)\s*~?\s*(\d{3,4})/);

    else if(/кредит|credit|advanced standing/.test(note))add("AP credit");
    else if(/обязателен|нужен|требуется|требует/.test(note))add("AP required");
    else if(/рекоменд/.test(note))add("AP recommended");

}

   {p:"Common App критерийлері: тегін немесе жеңілдік тамақ, SAT/ACT fee waiver, USDA кіріс нормасы, мемлекеттік көмек, low-income бағдарламалар, foster care немесе баспанасыздық, жетім мәртебесі, Pell Grant және school official-дың жазбаша растауы. Критерийлердің бір бөлігі америкалық; Қазақстан үшін мектептің растауы және вуз саясаты маңызды."},
   {p:"Не істеу керек: 1) Profile-те fee waiver толтырыңыз; 2) counsellor-дан растауды сұраңыз; 3) әр вузды жібергенде fee waiver таңдаңыз; 4) вуз қабылдады ма — тексеріңіз; 5) қабылдамаса, вуздың өз формасын іздеңіз. 650+ вуз шетелдіктерден төлем алмайды."},
   {p:"Fee waiver тек application fee-ді жабады. Тесттер, құжат жеткізу және виза бөлек төленеді."}

 en:[
  {t:"1. Start here: account and college list",sub:"List and requirements first, the form second.",b:[
   {p:"Create an account at apply.commonapp.org as a student. Use an email you check every day and save your password and recovery code."},
   {p:"Add 8–12 colleges in My Colleges. For each one, open the Requirements Grid: it shows whether SAT/ACT, IELTS/TOEFL, recommendations, a Portfolio, extra essays and which deadline are required."},
   {ul:["Split the list into 3 groups: 2–3 ambitious, 4–5 match, 2–3 safety.","Check whether the college accepts Common App or has its own application.","Put ED/EA/RD deadlines in your calendar now.","Do not start the essay before you know each college's questions."]},
   {p:"If a college does not accept Common App, do not fill it in blindly: it may have its own portal."}
  ]},
  {t:"2. Profile, Family, Education",sub:"Personal details, family and school.",b:[
   {p:"Profile: your name exactly as in your passport, date of birth, citizenship, address, phone and email. A name error is hard to fix later."},
   {p:"Family: your parents' education and work. If a parent does not work or you do not know the details, choose «does not apply» or «unknown»; do not invent them."},
   {p:"Education: school, year, dates, grades and courses. Your counsellor is the school person who sends the school report and transcript. Ask who it will be."},
   {ul:["Prepare a transcript in English or ask the school to translate it.","Check how your school calculates GPA and whether it ranks students.","If the school does not send documents through Common App, ask the college about an alternative."]}
  ]},
  {t:"3. Testing",sub:"SAT/ACT, IELTS/TOEFL and each college's policy.",b:[
   {p:"Common App does not send scores itself. You enter them in Testing (self-report) or order an official send from College Board/ETS if the college requires it."},
   {ul:["Check the policy: required, test-optional or test-blind.","If a college is test-optional and your score is below its range, do not send it.","IELTS/TOEFL are valid for 2 years: check that the score lasts until the deadline.","Some colleges accept Duolingo or PTE — see the Requirements Grid."]},
   {p:"Do not order official score sends to every college in advance: it costs money and is often unnecessary."}
  ]},
  {t:"4. Activities: 10 slots",sub:"Not 10 for the sake of it, but 6–10 meaningful ones.",b:[
   {p:"Activities has up to 10 slots. Six to eight strong entries are better than ten random ones. Everything counts: work, family responsibilities, caring for relatives, sport, clubs, volunteering, olympiads and hobbies."},
   {p:"Field limits: role — 50 characters, organisation — 100, description — 150. Give honest hours per week and weeks per year."},
   {p:"Description formula: what you did + for whom + result. For example: «Led 4 debates, prepared 12 cases, team reached city final» — specific, not «participated in various activities»."},
   {ul:["Write down 15–20 activities first, then choose the most important.","Show growth: from member to captain, from idea to project.","Do not inflate hours: an interview or documents may show the difference.","Work and family duties are a strong part of the application; do not hide them."]}
  ]},
  {t:"5. Honors: 5 slots",sub:"Awards and their level.",b:[
   {p:"Honors has up to 5 academic awards. Give the title, date and level: school, city/regional, national, international."},
   {ul:["Olympiads, competitions, scholarships, Dean's list, research projects.","If an award was a team result, state your role.","Do not add participation awards with no selection: they weaken the list.","If a college may not know the award, add a 5–8 word explanation."]}
  ]},
  {t:"6. Writing: main essay and supplements",sub:"650 words plus each college's questions.",b:[
   {p:"The main essay is up to 650 words. It is not a list of achievements but a story of how you think and change. Choose one specific episode, show the scene, your actions and what you learned."},
   {ul:["Draft, get feedback, draft again. Plan for 3–5 versions.","Do not repeat Activities: the facts are already there.","In a «Why us» essay, name specific courses, professors, labs and programmes.","Check each college's word limit: it may be 100, 150, 250 or 400."]},
   {p:"Adult help means questions and comments. If someone else wrote the text, it shows in the style and in interview answers."}
  ]},
  {t:"7. Recommendations and school forms",sub:"Ask early and give the teacher material.",b:[
   {p:"You usually need a counsellor and 1–2 teachers. The exact list is in My Colleges. The school sends the school report, transcript and recommendations."},
   {ul:["Ask at least 4–6 weeks before the deadline.","Give the teacher a brag sheet: projects, grades, what you read, what you are proud of.","Tell them which colleges and deadlines, and how to send the form.","Check the status in Common App: a form can be «invited» but not sent.","The FERPA waiver is optional; it is not required for admission."]},
   {p:"If a teacher does not speak English, ask the school who will translate and send the letter."}
  ]},
  {t:"8. Creative portfolio",sub:"Only if the college asks.",b:[
   {p:"For art, design, architecture, music, film and some other programmes, a college may ask for a portfolio separate from the application. This is not the same as Activities."},
   {ul:["Check the Portfolio column in the Requirements Grid and the instructions in My Colleges.","The college sets the format, number of works, file size and deadline.","Uploads often go through SlideRoom or the college portal.","Caption each work: title, year, medium, size and your role.","Do not send a generic collection if the college asks for a specific format."]}
  ]},
  {t:"9. Fee waiver",sub:"Removing the application fee: how to ask and what matters.",b:[
   {p:"Each college charges the application fee, not Common App. A fee waiver is a request to remove that fee. It is in Profile → Common App Fee Waiver: answer «Yes», read the criteria and sign."},
   {p:"Your counsellor or a school official confirms the need. The college decides: some accept waivers only from US citizens, some do not accept them at all. For an international student a waiver is not automatic."},
   {p:"Common App criteria include free or reduced-price lunch, an SAT/ACT fee waiver, income within USDA guidelines, public assistance, low-income programmes, foster care or homelessness, orphan status, Pell Grant and a written statement from a school official. Some criteria are US-specific; for Kazakhstan the school confirmation and the college's policy matter most."},
   {p:"What to do: 1) complete the fee waiver in Profile; 2) ask your counsellor to confirm; 3) choose the fee waiver when submitting each college; 4) check whether the college accepted it; 5) if it refused, look for the college's own form. 650+ colleges charge no application fee to international students."},
   {p:"A fee waiver covers the application fee only. Tests, document delivery and the visa are paid separately."}
  ]},
  {t:"10. Submit and after",sub:"Review, send and do not miss a deadline.",b:[
   {ul:["Review your name, date of birth, email, colleges and essays.","Sign and submit. Save the confirmation.","Open each college portal within 1–2 days: it shows which documents arrived.","If something is missing, email admissions and your counsellor.","Track interviews, the mid-year report and extra forms.","Do not wait for the last hour: the server may stall."]},
   {table:[["When","What to do"],["Summer–September","Account, list, Activities, essay draft"],["September–October","Recommendations, tests, supplements"],["November","ED/EA deadlines"],["December–January","RD deadlines"],["After submitting","Portals, interviews, mid-year report"]]},
   {p:"Dates depend on the college. Check My Colleges, not a generic calendar."}
  ]}
 ]

const COMMONAPP_LINKS=[["First-year guide","https://www.commonapp.org/apply/first-year-students/"],["Activities (PDF)","https://www.commonapp.org/static/a5d59a915bdc2031e62c468ad35e0de9/Resource_FY_Activities_ENG_2025.06.25_0.pdf"],["Fees & fee waivers (PDF)","https://www.commonapp.org/static/653ded5d8d0d5d685e10ae814a7b2c85/Understanding-App-Fees-and-Waivers.pdf"],["2026–27 Requirements Grid","https://content.commonapp.org/Files/ReqGrid.pdf"],["Essay prompts","https://www.commonapp.org/apply/essay-prompts"]];

function blockHtml(b){
  if(b.h)return `<h4>${esc(b.h)}</h4>`;
  if(b.p)return `<p>${esc(b.p)}</p>`;
  if(b.ul)return `<ul>${b.ul.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(b.table)return `<div class="tbl"><table><thead><tr>${b.table[0].map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${b.table.slice(1).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return "";
}
function renderArticles(){
  $("#langNote").textContent="";
  $("#articleList").innerHTML=GUIDES.map((a,i)=>{const g=(GUIDE_T[lang]||[])[i]||[a.t,a.l],bb=g[2]||a.b;return `<details class="article"${i===0?" open":""}><summary><b>${esc(g[0])}</b><span>${esc(g[1])}</span></summary><div class="article-body">${bb.map(blockHtml).join("")}</div></details>`;}).join("");
}
function renderCommonApp(){
  const t=T[lang];
  const intro=(COMMONAPP_INTRO[lang]||COMMONAPP_INTRO.ru).map(blockHtml).join("");
  const guide=(COMMONAPP_GUIDE[lang]||COMMONAPP_GUIDE.ru).map((g,i)=>`<details class="article"${i===0?" open":""}><summary><b>${esc(g.t)}</b><span>${esc(g.sub)}</span></summary><div class="article-body">${g.b.map(blockHtml).join("")}</div></details>`).join("");
  $("#commonappBody").innerHTML=intro+`<div id="commonappSections" class="articles-wrap">${guide}</div>`;
  $("#commonappSources").innerHTML=esc(t.commonappSources)+" "+COMMONAPP_LINKS.map(([l,u])=>`<a class="link" href="${u}" target="_blank" rel="noopener">${esc(l)}</a>`).join(" · ");
}
function calcUpdate(){
  const t=T[lang];
  const i=Math.max(0,parseInt($("#calcI").value)||0), n=Math.max(0,parseInt($("#calcS").value)||0), r=parseFloat($("#calcR").value);
  const ie=i*IELTS_PRICE, se=n*SAT_PRICE;
  let out="IELTS: "+ie.toLocaleString("ru-RU")+" ₸ · SAT: $"+se.toLocaleString("en-US");
  if(!isNaN(r)&&r>0) out+=" — "+t.calcTotal+": ≈ "+Math.round(ie+se*r).toLocaleString("ru-RU")+" ₸";
  $("#calcOut").textContent=out;
}
function renderCosts(){
  const t=T[lang];
  $("#costGrid").innerHTML=COSTS.map(c=>`
    <article class="card">
      <h3>${esc(t["cost_"+c.k+"_t"])}</h3>
      <div class="price">${esc(c.price)}</div>
      <p>${esc(t["cost_"+c.k+"_d"])}</p>
      <a class="link" href="${c.u}" target="_blank" rel="noopener">${esc(t.costSource)}</a>
    </article>`).join("");
  $("#faqList").innerHTML=t.faq.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
  calcUpdate();
}
function renderCourses(){
  $("#courseGrid").innerHTML=COURSES.map((c,k)=>{const ct=(COURSE_T[lang]||[])[k]||{};return `
    <article class="card course-card">
      ${c.official?`<span class="badge-official">${esc(T[lang].officialPartner)}</span>`:""}
      <h3>${esc(c.n)}</h3>
      <div class="city">${esc(ct.city||c.city)}</div>
      <div class="tags">${c.tags.map(x=>`<span class="tag">${esc(tagLabel(x))}</span>`).join("")}</div>
      <p>${esc(ct.d||c.d)}</p>
      <a class="link" href="${c.u}" target="_blank" rel="noopener">${esc(T[lang].courseSite)}</a>
    </article>`;}).join("");
}

      const err=new Error(txt||("HTTP "+r.status));
      err.status=r.status;
      throw err;
    }
    const j=await r.json();
    let answer=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(Array.isArray(answer))answer=answer.map(p=>p&&p.text||"").join("");

    return answer;
  }finally{
    clearTimeout(timer);
  }
}

    const lines=[`<b>${k+1}. ${esc(u.n)}</b> · ${esc(countryName(u))}`];
    const tags=(u.tags||[]).slice(0,3).map(x=>tagLabel(x,advisorLang));
    if(tags.length)lines.push(esc(t.modalReqs)+": "+esc(tags.join(" · ")));
    if(u.m&&u.m.cost)lines.push(esc(t.moneyCost)+": "+esc(u.m.cost.v));
    if(u.dl)lines.push(esc(t.fDeadline)+": "+esc(u.dl));
    if(u.acc)lines.push(esc(t.fAcc)+": "+esc(u.acc));
    const c=costUsd(u);
    if(p.budget&&c&&c>p.budget*1.05)lines.push(esc(P.overBudget));
    lines.push(`<a href="${esc(u.u)}" target="_blank" rel="noopener">${esc(t.site)}</a>`);
    out.push(lines.join("\n"));
  });
  if(p.budget&&cards.some(u=>costUsd(u)==null))out.push(esc(P.budgetUnknown));
  out.push(esc(P.disclaimer));
  return out.join("\n\n");
}
function faqKey(low){
  if(/\b(ielts|toefl|айлтс)\b/i.test(low))return "ielts";
  if(/\b(sat|act)\b/i.test(low))return "sat";
  if(/(стоимост|сколько стоит|цена|cost|tuition|құны)/i.test(low))return "cost";
  if(/(дедлайн|deadline|когда пода|мерзім)/i.test(low))return "deadline";
  if(/(виза|visa|виза)/i.test(low))return "visa";
  if(/(стипенд|scholarship|финанс|aid|грант|қаржы)/i.test(low))return "aid";
  if(/(документ|эссе|essay|рекомендац|document)/i.test(low))return "docs";
  if(/(жизн|кампус|общежит|студенческ|life|campus|dorm|housing|accommodation|өмір|жатақхана)/i.test(low))return "life";
  if(/(что ты|кто ты|помощь|help|что умеешь|мүмкіндік)/i.test(low))return "help";
  return null;
}
function publicReply(text){
  advisorLang=advisorLanguage(text);
  const P=PUBLIC_TEXT[advisorLang],low=text.toLowerCase().trim();
  const isQuestion=(/\?|(^|\s)(что|как|какие|какой|какая|почему|зачем|расскажи|можно|стоит ли|сколько|где|когда|who|what|how|why|which|when|where|can|tell me)(?=\s|$|[?.!,])/i.test(low))&&!/\d/.test(low);
  const changed=isQuestion?false:parseProfile(text);
  const uni=findUni(text);
  if(uni)return {html:uniAnswer(uni)};
  if(changed){
    const q=nextPublicQuestion(publicProfile);
    if(q){publicAsk=q.key;return {html:esc(q.text)};}
    publicAsk=null;return {html:recommendHtml(publicProfile)};
  }
  if(/^(привет|сәлем|салам|hello|hi|здравствуй|добрый день)/i.test(low))return {html:esc(P.hello)};
  if(/^(спасибо|рахмет|thank)/i.test(low))return {html:esc(P.thanks)};
  const f=faqKey(low);
  if(f){
    const q=nextPublicQuestion(publicProfile);
    if(q)publicAsk=q.key;
    return {html:esc(P.faq[f]+(q?"\n\n"+q.text:""))};
  }
  const q=nextPublicQuestion(publicProfile);
  if(q){publicAsk=q.key;return {html:esc(P.notUnderstood+"\n\n"+q.text)};}
  if(/(ещё|еще|другие|other|more|басқа)/i.test(low))return {html:recommendHtml(publicProfile)};
  publicAsk=null;return {html:esc(P.notUnderstood+"\n\n"+P.faq.help)};
}

async function chatReply(text){
  const c=chatT();
  if(chatBusy)return;
  chatBusy=true;
  const btn=document.getElementById("chatSend");
  const input=document.getElementById("chatInput");
  btn.disabled=true;input.disabled=true;
  chatMsgs.push({role:"user",content:text});
  chatAdd(text,"me");
  const wait=chatAdd(c.thinking,"bot");
  let lastErr=null;
  try{
    if(!API){
      const ans=publicReply(text);
      wait.remove();
      const plain=ans&&ans.html?ans.html.replace(/<[^>]*>/g,""):"";
      chatMsgs.push({role:"assistant",content:plain});
      chatAddRich(ans.html,"bot");
    }else{
      for(let attempt=1;attempt<=3;attempt++){
        try{
          if(attempt>1)wait.textContent=c.retry;
          const answer=await chatOnce(attempt===1?30000:45000);
          wait.remove();
          chatMsgs.push({role:"assistant",content:answer});
          chatAdd(answer,"bot");
          lastErr=null;
          break;
        }catch(e){
          lastErr=e;
          const st=e.status;
          if(st&&st>=400&&st<500&&st!==429)break;
          if(attempt<3)await chatSleep(1000*attempt);
        }
      }
    }
    if(lastErr){
      wait.remove();
      let msg=lastErr.message||String(lastErr);
      if(lastErr.name==="AbortError")msg=c.timeout;
      else if(lastErr.code==="empty")msg=c.noanswer;
      else if(lastErr.status)msg="HTTP "+lastErr.status+": "+msg;
      else msg=c.net;
      chatAdd(c.err+msg,"err");
    }
  }catch(e){
    wait.remove();
    const detail=e&&e.message?String(e.message).slice(0,180):String(e);
    chatAdd(c.err+(API?detail:c.modelFail+" "+detail),"err");
    console.error(e);
  }finally{
    chatBusy=false;btn.disabled=false;input.disabled=false;input.focus();
  }
}
function openChat(){
  const panel=document.getElementById("chatPanel");
  const log=document.getElementById("chatLog");
  if(!panel)return;
  panel.hidden=false;
  if(!log.children.length)chatAdd(chatT().hello,"bot",true);
  if(!API&&!log.dataset.publicnote){chatAdd(chatT().publicNote,"bot");log.dataset.publicnote="1";}
  document.getElementById("chatInput").focus();
}
function closeChat(){
  document.getElementById("chatPanel").hidden=true;
}
function initChat(){
  document.getElementById("chatX").addEventListener("click",closeChat);
  document.getElementById("chatForm").addEventListener("submit",e=>{
    e.preventDefault();
    const input=document.getElementById("chatInput");
    const text=input.value.trim();
    if(!text){input.focus();return;}
    input.value="";
    chatReply(text);
  });
  document.getElementById("chatInput").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("chatForm").requestSubmit();}
  });
}
initChat();
